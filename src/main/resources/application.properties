vaadin.launch-browser=true
spring.application.name=famigo

spring.devtools.restart.enabled=true

# Verbindungsdaten: lokal liefert spring-boot-docker-compose sie aus docker-compose.yml (+ .env),
# im Container kommen sie per SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD. Keine Zugangsdaten hier.
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8080

# Docker-Compose-Support: startet beim App-Start automatisch die DB (falls nicht laeuft).
# start_only = die DB wird beim App-Stop NICHT heruntergefahren (bleibt persistent).
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start_only

# Schema wird ausschliesslich ueber Flyway (src/main/resources/db/migration) verwaltet.
# Bestehende DBs ohne Flyway-Historie werden als Version 1 (Baseline) markiert.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
#im vaadin-dev modus
vaadin.productionMode=false

#im docker container
#vaadin.productionMode=true
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true