vaadin.launch-browser=true
spring.application.name=famigo

spring.devtools.restart.enabled=true

# Lokaler IDE-Modus: Verbindung zur Docker-DB auf Host-Port 5433
# (Port 5432 ist vom nativen PostgreSQL auf dem Host belegt!)
# Im Docker-Container wird diese URL per SPRING_DATASOURCE_URL ueberschrieben.
spring.datasource.url=jdbc:postgresql://localhost:5433/famigo
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8080

# Docker-Compose-Support: startet beim App-Start automatisch die DB (falls nicht laeuft).
# start_only = die DB wird beim App-Stop NICHT heruntergefahren (bleibt persistent).
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start_only

spring.jpa.hibernate.ddl-auto=update
#im vaadin-dev modus
vaadin.productionMode=false

#im docker container
#vaadin.productionMode=true
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true