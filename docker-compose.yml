services:
  # Die App im Container laeuft NICHT im Standardbetrieb.
  # Standard: "docker compose up -d" startet nur die DB (Service ohne Profil).
  # Nur die App im Container: "docker compose --profile full up -d".
  app:
    build: .
    container_name: famigo-app
    profiles: ["full"]
    # KEIN unless-stopped: der App-Container soll nach einem Reboot NICHT von selbst hochkommen.
    restart: "no"
    environment:
      # Container-zu-Container: interner Port 5432 (NICHT der Host-Port 5433!)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/famigo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      VAADIN_PRODUCTIONMODE: "true"
      # Im Container gibt es kein Docker-in-Docker -> Compose-Automatik abschalten.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      # Host 8081 -> Container 8080, damit eine lokale IDE-App auf 8080 parallel laufen kann
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: famigo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: famigo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Host 5433 -> Container 5432, weil auf dem Host bereits ein nativer PostgreSQL auf 5432 laeuft
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d famigo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
